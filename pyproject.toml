[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-manager"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
tickets = "ticket_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-depends"]

[tool.setuptools.packages.find]
include = ["ticket_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]